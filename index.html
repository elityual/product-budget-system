<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title> Atlas Máquinas & Obras | Gestão Comercial</title>
  
  <!-- Estilos mantidos separadamente para facilitar a manutenção. -->
  <link rel="stylesheet" href="assets/css/menu.css">

</head>

<body>
  <!-- Cabeçalho do sistema, inspirado na faixa escura da referência. -->
  <header class="topbar">
    <div class="brand"><i></i> Atlas Máquinas & Obras</div>

    <span>Gestão comercial • <time id="current-date"></time></span><b>GC</b>

  </header>

  <main>
    
    <!-- Atalhos visuais da esquerda. -->
    <nav class="icons">

      <button>☰</button>

      <button>▣</button>

      <button>▤</button>

      <button>⚙</button>

    </nav>
    
    <!-- Opções baseadas nos requisitos documentados em docs/ideas.text. -->
    <aside><h2>MENU PRINCIPAL</h2>

      <button class="active" data-page="clientes" data-menu="clientes">Clientes</button>

        <button class="sub" data-client-action="listar" data-menu="clientes">Listar clientes</button>
        
        <button class="sub" data-new="clientes" data-menu="clientes">Novo cliente</button>

      <button data-page="itens" data-menu="produtos">Produtos</button>

        <button class="sub" data-product-action="listar" data-menu="produtos">Listar produtos</button>

        <button class="sub" data-page="categorias" data-menu="produtos">Categorias</button>

        <button class="sub" data-new="itens" data-menu="produtos">Novo produto</button>

      <button data-page="orcamentos" data-menu="orcamentos">Orçamentos</button>

        <button class="sub" data-budget-action="listar" data-menu="orcamentos">Listar orçamentos</button>

        <button class="sub" data-page="itensOrcamento" data-menu="orcamentos">Itens do orçamento</button>
      
        <button class="sub" data-new="orcamentos" data-menu="orcamentos">Novo orçamento</button>

      <button id="exit">Sair</button>
    </aside>

    <!-- Conteúdo principal: títulos, resumo, pesquisa e tabela. -->
    <section class="content">
      <p class="crumb">Início / <span id="crumb">Clientes</span></p>
        <h1 id="title">CLIENTES</h1>
      
      <div class="heading">
        <div>
          <h3 id="subtitle">Cadastro de clientes</h3>
          <p id="description">Consulte e gerencie os clientes cadastrados no sistema.</p>
        </div>
        
        <button class="primary" id="new">+ INCLUIR CLIENTE</button>
      </div>
      
      <div class="filters">
        <label class="search"><span class="search-icon" aria-hidden="true"></span>
          <input
          id="filter"
          type="search"
          placeholder="Pesquisar registro">
        </label>

        <div class="type-filter" id="client-type-filter">
          <span>Tipo</span>
          <div class="dropdown filter-control" data-dropdown>
            <input class="dropdown-value" id="client-type" type="hidden" value="">
            <button class="dropdown-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="client-type-options">
              <span data-dropdown-label>Todos</span><span class="dropdown-icon" aria-hidden="true">▾</span>
            </button>
            <div class="dropdown-options hidden" id="client-type-options" role="listbox">
              <button type="button" role="option" aria-selected="true" data-dropdown-option="">Todos</button>
              <button type="button" role="option" aria-selected="false" data-dropdown-option="Pessoa Física">Pessoa Física</button>
              <button type="button" role="option" aria-selected="false" data-dropdown-option="Pessoa Jurídica">Pessoa Jurídica</button>
            </div>
          </div>
        </div>

        <div class="type-filter hidden" id="category-filter-container">
          <span>Categoria</span>
          <div class="combobox filter-control" data-combobox>
            <input id="category-filter" type="text" autocomplete="off" placeholder="Todas / pesquisar" role="combobox" aria-autocomplete="list" aria-controls="category-filter-options" aria-expanded="false">
            <div class="combo-options hidden" id="category-filter-options"></div>
          </div>
        </div>

        <div class="type-filter hidden" id="status-filter-container">
          <span>Status</span>
          <div class="dropdown filter-control" data-dropdown>
            <input class="dropdown-value" id="status-filter" type="hidden" value="">
            <button class="dropdown-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="status-filter-options">
              <span data-dropdown-label>Todos</span><span class="dropdown-icon" aria-hidden="true">▾</span>
            </button>
            <div class="dropdown-options hidden" id="status-filter-options" role="listbox">
              <button type="button" role="option" aria-selected="true" data-dropdown-option="">Todos</button>
              <button type="button" role="option" aria-selected="false" data-dropdown-option="Ativo">Ativo</button>
              <button type="button" role="option" aria-selected="false" data-dropdown-option="Inativo">Inativo</button>
            </div>
          </div>
        </div>
      </div>

      <div class="table">
        <table>
          <thead id="thead"></thead>
          
          <tbody id="tbody"></tbody>

        </table>
      </div>

      <nav class="pagination" id="pagination" aria-label="Paginação da tabela">
        <button class="secondary" type="button" id="previous-page">Anterior</button>
        <span id="page-info" aria-live="polite">Página 1 de 1</span>
        <button class="secondary" type="button" id="next-page">Próxima</button>
      </nav>

    </section>
  </main>

  <!-- Janela reutilizada para os formulários de incluir e editar. -->
  <div class="overlay hidden" id="overlay"><section class="modal"><header><h2 id="modal-title">Novo registro</h2><button id="close">×</button></header><form id="form"></form></section></div>
  
  <!-- JavaScript separado: dados demonstrativos e interações. -->
  <script type="module" src="assets/js/menu.js"></script>

</body>

</html>
